services:
  emqx:
    image: emqx/emqx:5.8.3
    container_name: devicenet-emqx
    hostname: emqx
    ports:
      - "8883:8883"
      - "8084:8084"
      - "127.0.0.1:18083:18083"
      - "127.0.0.1:1883:1883"
    environment:
      EMQX_NAME: emqx
      EMQX_HOST: 127.0.0.1
      EMQX_DASHBOARD__DEFAULT_PASSWORD: "${EMQX_DASHBOARD_PASSWORD}"
    volumes:
      - ./emqx.conf:/opt/emqx/etc/emqx.conf:ro
      - ./certs:/etc/certs:ro
      - emqx_data:/opt/emqx/data
      - emqx_log:/opt/emqx/log
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD", "emqx", "ctl", "status"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - devicenet

  caddy:
    image: caddy:2.8.4
    container_name: devicenet-caddy
    ports:
      - "443:443"
    environment:
      MQTT_DOMAIN: "${MQTT_DOMAIN}"
      EMQX_SHARED_TOKEN: "${EMQX_SHARED_TOKEN}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/etc/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    depends_on:
      - emqx
    networks:
      - devicenet

volumes:
  emqx_data:
  emqx_log:
  caddy_data:
  caddy_config:

networks:
  devicenet:
    driver: bridge
