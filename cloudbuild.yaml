steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-f'
      - 'apps/api/Dockerfile'
      - '-t'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/devicenet/api:latest'
      - '.'
images:
  - '$_REGION-docker.pkg.dev/$PROJECT_ID/devicenet/api:latest'
substitutions:
  _REGION: 'asia-southeast1'
options:
  logging: CLOUD_LOGGING_ONLY
