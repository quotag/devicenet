<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>SH-3 Sửa thiết bị nhanh</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/devicenet/components/bundle.css">
<link rel="stylesheet" href="dn.css">
<script src="ds/devicenet/components/bundle.js"></script>
<script src="dn-icons.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
body{margin:0}
a{color:#2f6bff}a:hover{color:#1f4fd0}
</style>
</helmet>
<div class="ph {{theme}}" style="position: relative; width: 390px; height: 844px; display: flex; flex-direction: column; overflow: hidden">
  <header class="hdr">
    <div class="hdr-l">
      <button class="ibtn" type="button" aria-label="Quay lại"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5"></path><path d="M12 19l-7-7 7-7"></path></svg></button>
      <h1 class="title" style="font-size: 17px">Ổ cắm máy giặt</h1>
    </div>
    <div class="hdr-r">
      <button class="ibtn" type="button" aria-label="Đang sửa" aria-expanded="true" style="color: var(--accent)"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg></button>
    </div>
  </header>
  <div class="body" style="gap: 20px; padding: 24px 16px 0">
    <div style="display: flex; align-items: center; gap: 16px">
      <span style="width: 56px; height: 56px; border-radius: 16px; background: var(--on-tint); color: var(--accent); display: inline-flex; align-items: center; justify-content: center; flex: none"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 32px; height: 32px"><path d="M12 22v-5"></path><path d="M9 8V2"></path><path d="M15 8V2"></path><path d="M18 8H6v4a6 6 0 0 0 12 0V8z"></path></svg></span>
      <div class="row-main"><span class="dn-num" style="font-size: 32px; line-height: 38px; font-weight: 600">Đang bật · 86 W</span><span class="cap">Bếp · online</span></div>
    </div>
  </div>
  <div class="scrim" aria-hidden="true"></div>
  <div style="position: absolute; left: 0; right: 0; bottom: 0">
    <x-import component-from-global-scope="DeviceNet.Sheet" title="Sửa thiết bị" style="width: 100%">
      <div style="display: flex; flex-direction: column; gap: 16px">
        <x-import component-from-global-scope="DeviceNet.Input" label="Tên" default-value="Ổ cắm máy giặt" style="width: 100%"></x-import>
        <div style="display: flex; flex-direction: column; gap: 8px">
          <span class="lbl">Room</span>
          <div style="display: flex; gap: 8px; flex-wrap: wrap">
            <x-import component-from-global-scope="DeviceNet.Chip" selected="{{yes}}">Bếp</x-import>
            <x-import component-from-global-scope="DeviceNet.Chip">Phòng khách</x-import>
            <x-import component-from-global-scope="DeviceNet.Chip">Phòng ngủ</x-import>
            <x-import component-from-global-scope="DeviceNet.Chip">Sân</x-import>
            <x-import component-from-global-scope="DeviceNet.Chip" add="{{yes}}">Room mới</x-import>
          </div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 8px">
          <span class="lbl">Icon</span>
          <div style="display: flex; flex-wrap: wrap; gap: 8px" role="radiogroup" aria-label="Icon thiết bị">
            <button type="button" role="radio" aria-checked="true" aria-label="Ổ cắm" style="width: 44px; height: 44px; border-radius: 12px; border: 2px solid var(--accent); background: var(--on-tint); color: var(--accent); display: inline-flex; align-items: center; justify-content: center; cursor: pointer"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22v-5"></path><path d="M9 8V2"></path><path d="M15 8V2"></path><path d="M18 8H6v4a6 6 0 0 0 12 0V8z"></path></svg></button>
            <button type="button" role="radio" aria-checked="false" aria-label="Công tắc" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); display: inline-flex; align-items: center; justify-content: center; cursor: pointer"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5h8a7 7 0 0 1 0 14H8A7 7 0 0 1 8 5z"></path><path d="M8 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"></path></svg></button>
            <button type="button" role="radio" aria-checked="false" aria-label="Đèn" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); display: inline-flex; align-items: center; justify-content: center; cursor: pointer"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6"></path><path d="M10 22h4"></path><path d="M15.1 14c.6-.7 1.9-1.6 1.9-4a5 5 0 0 0-10 0c0 2.4 1.3 3.3 1.9 4 .4.5.6 1.2.6 2h5c0-.8.2-1.5.6-2z"></path></svg></button>
            <button type="button" role="radio" aria-checked="false" aria-label="Quạt" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); display: inline-flex; align-items: center; justify-content: center; cursor: pointer"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="2"></circle><path d="M12 10V4a3 3 0 0 1 3 3"></path><path d="M14 12h6a3 3 0 0 1-3 3"></path><path d="M12 14v6a3 3 0 0 1-3-3"></path><path d="M10 12H4a3 3 0 0 1 3-3"></path></svg></button>
            <button type="button" role="radio" aria-checked="false" aria-label="Nhiệt độ" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); display: inline-flex; align-items: center; justify-content: center; cursor: pointer"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4v10.5a4 4 0 1 1-4 0V4a2 2 0 1 1 4 0z"></path></svg></button>
            <button type="button" role="radio" aria-checked="false" aria-label="Điện năng" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); display: inline-flex; align-items: center; justify-content: center; cursor: pointer"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"></path></svg></button>
            <button type="button" role="radio" aria-checked="false" aria-label="Chuyển động" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); display: inline-flex; align-items: center; justify-content: center; cursor: pointer"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M19.07 4.93A10 10 0 0 0 6.99 3.34"></path><path d="M4 6h.01"></path><path d="M2.29 9.62A10 10 0 1 0 21.31 8.35"></path><path d="M16.24 7.76A6 6 0 1 0 8.23 16.67"></path><path d="M12 18h.01"></path><path d="M17.99 11.66A6 6 0 0 1 15.77 16.67"></path><path d="M14 12a2 2 0 1 1-4 0 2 2 0 0 1 4 0z"></path><path d="m13.41 10.59 5.66-5.66"></path></svg></button>
            <button type="button" role="radio" aria-checked="false" aria-label="Cửa" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); display: inline-flex; align-items: center; justify-content: center; cursor: pointer"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M13 4h3a2 2 0 0 1 2 2v14"></path><path d="M2 20h3"></path><path d="M13 20h9"></path><path d="M10 12v.01"></path><path d="M13 4.562v16.157a1 1 0 0 1-1.242.97L5 20V5.562a2 2 0 0 1 1.515-1.94l4-1A2 2 0 0 1 13 4.561Z"></path></svg></button>
          </div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 4px">
          <span class="lbl">Thuộc tính chính trên tile</span>
          <div class="list" style="margin: 0" role="radiogroup" aria-label="Thuộc tính chính">
            <div class="row" style="min-height: 40px"><span class="radio radio-on" aria-hidden="true"></span><span class="lbl" style="flex: 1">Công suất</span><span class="cap dn-num">86 W</span></div>
            <div class="row" style="min-height: 40px"><span class="radio" aria-hidden="true"></span><span class="lbl" style="flex: 1">Điện áp</span><span class="cap dn-num">228 V</span></div>
            <div class="row" style="min-height: 40px"><span class="radio" aria-hidden="true"></span><span class="lbl" style="flex: 1">Dòng điện</span><span class="cap dn-num">0,38 A</span></div>
            <div class="row" style="min-height: 40px"><span class="radio" aria-hidden="true"></span><span class="lbl" style="flex: 1">Điện năng</span><span class="cap dn-num">12,4 kWh</span></div>
          </div>
        </div>
        <div style="display: flex; gap: 8px">
          <x-import component-from-global-scope="DeviceNet.Button" variant="secondary" style="flex: 1">Hủy</x-import>
          <x-import component-from-global-scope="DeviceNet.Button" variant="primary" style="flex: 1">Lưu</x-import>
        </div>
      </div>
    </x-import>
  </div>
  <div class="home" aria-hidden="true" style="background: #fff; opacity: .8"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false,"section":"Giao diện"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { yes: true, no: false, theme: this.props.dark ? 'dn-dark' : 'dn-light' };
  }
}
</script>
</body>
</html>
