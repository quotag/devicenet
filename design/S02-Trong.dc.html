<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>S-02 Automate · trống</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/devicenet/components/bundle.css">
<link rel="stylesheet" href="dn.css">
<script src="ds/devicenet/components/bundle.js"></script>
<script src="dn-icons.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
body{margin:0}
a{color:#2f6bff}a:hover{color:#1f4fd0}
</style>
</helmet>
<div class="ph {{theme}}" style="position: relative; width: 390px; height: 844px; display: flex; flex-direction: column; overflow: hidden">
  <header class="hdr">
    <div class="hdr-l"><h1 class="title">Automate</h1></div>
    <div class="hdr-r">
      <button class="ibtn" type="button" aria-label="Tạo scene hoặc automation"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg></button>
    </div>
  </header>
  <div class="body" style="gap: 16px; padding: 12px 16px 0">
    <x-import component-from-global-scope="DeviceNet.SegmentedTabs" items="{{tabs}}" value="{{tabIdx}}" style="width: 100%"></x-import>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 24px 16px 8px; text-align: center">
      <span class="lbl" style="font-size: 20px; line-height: 26px; font-weight: 600; white-space: normal">{{emptyTitle}}</span>
      <p class="body-t" style="color: var(--text-muted)">{{emptyBody}}</p>
    </div>
    <span class="cap">Gợi ý từ thiết bị của bạn</span>
    <sc-if value="{{isScene}}" hint-placeholder-val="{{yes}}">
      <div style="display: flex; flex-direction: column; gap: 12px">
        <button type="button" class="card" style="display: flex; align-items: center; gap: 12px; text-align: left; color: var(--text); cursor: pointer; font-family: inherit; border-style: dashed">
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--accent)"><path d="M12 22v-5"></path><path d="M9 8V2"></path><path d="M15 8V2"></path><path d="M18 8H6v4a6 6 0 0 0 12 0V8z"></path></svg>
          <span class="row-main"><span class="lbl">Tắt hết ổ cắm</span><span class="cap">3 hành động · Ổ cắm máy giặt, tủ lạnh, quạt</span></span>
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--text-muted)"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>
        </button>
        <button type="button" class="card" style="display: flex; align-items: center; gap: 12px; text-align: left; color: var(--text); cursor: pointer; font-family: inherit; border-style: dashed">
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--accent)"><path d="M9 18h6"></path><path d="M10 22h4"></path><path d="M15.1 14c.6-.7 1.9-1.6 1.9-4a5 5 0 0 0-10 0c0 2.4 1.3 3.3 1.9 4 .4.5.6 1.2.6 2h5c0-.8.2-1.5.6-2z"></path></svg>
          <span class="row-main"><span class="lbl">Bật đèn sân</span><span class="cap">1 hành động · Đèn sân</span></span>
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--text-muted)"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>
        </button>
        <button type="button" class="card" style="display: flex; align-items: center; gap: 12px; text-align: left; color: var(--text); cursor: pointer; font-family: inherit; border-style: dashed">
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--accent)"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
          <span class="row-main"><span class="lbl">Đi ngủ</span><span class="cap">2 hành động · tắt đèn khách, tắt quạt sau 30 phút</span></span>
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--text-muted)"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>
        </button>
      </div>
    </sc-if>
    <sc-if value="{{isRule}}" hint-placeholder-val="{{no}}">
      <div style="display: flex; flex-direction: column; gap: 12px">
        <button type="button" class="card" style="display: flex; align-items: center; gap: 12px; text-align: left; color: var(--text); cursor: pointer; font-family: inherit; border-style: dashed">
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--accent)"><circle cx="12" cy="12" r="10"></circle><path d="M12 6v6l4 2"></path></svg>
          <span class="row-main"><span class="lbl">Tắt ổ cắm máy giặt lúc 23:00</span><span class="cap">Thời gian → Đặt thiết bị</span></span>
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--text-muted)"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>
        </button>
        <button type="button" class="card" style="display: flex; align-items: center; gap: 12px; text-align: left; color: var(--text); cursor: pointer; font-family: inherit; border-style: dashed">
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--accent)"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"></path></svg>
          <span class="row-main"><span class="lbl">Báo khi công suất &gt; 1500 W</span><span class="cap">Thiết bị → Thông báo</span></span>
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--text-muted)"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>
        </button>
        <button type="button" class="card" style="display: flex; align-items: center; gap: 12px; text-align: left; color: var(--text); cursor: pointer; font-family: inherit; border-style: dashed">
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--accent)"><path d="M12 10V2"></path><path d="M4.93 10.93l1.41 1.41"></path><path d="M2 18h2"></path><path d="M20 18h2"></path><path d="M19.07 10.93l-1.41 1.41"></path><path d="M22 22H2"></path><path d="M16 6l-4 4-4-4"></path><path d="M16 18a4 4 0 0 0-8 0"></path></svg>
          <span class="row-main"><span class="lbl">Bật đèn sân khi mặt trời lặn</span><span class="cap">Mặt trời → Đặt thiết bị</span></span>
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--text-muted)"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>
        </button>
      </div>
    </sc-if>
    <x-import component-from-global-scope="DeviceNet.Button" variant="primary" block="{{yes}}" style="width: 100%; margin-top: 8px">{{cta}}</x-import>
  </div>
  <nav class="tabbar" aria-label="Điều hướng chính">
    <a class="tab" href="S01-Home.dc.html"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><path d="M9 22V12h6v10"></path></svg>Home</a>
    <a class="tab tab-on" href="S02-Trong.dc.html" aria-current="page"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"></path></svg>Automate</a>
    <a class="tab" href="S03-Me.dc.html"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>Me</a>
  </nav>
  <div class="home" aria-hidden="true"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false,"section":"Giao diện"},"tab":{"editor":"enum","options":["scene","automation"],"default":"scene","section":"Trạng thái"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var isScene = (this.props.tab || 'scene') === 'scene';
    return { yes: true, no: false, theme: this.props.dark ? 'dn-dark' : 'dn-light', tabs: ['Tap-to-run', 'Automation'],
      isScene: isScene, isRule: !isScene, tabIdx: isScene ? 0 : 1,
      emptyTitle: isScene ? 'Chưa có scene nào' : 'Chưa có automation nào',
      emptyBody: isScene ? 'Scene gom nhiều hành động vào một nút bấm. Chạm card gợi ý để tạo ngay.' : 'Automation tự chạy khi điều kiện xảy ra, ngay trên hub kể cả khi mất internet.',
      cta: isScene ? 'Tạo scene' : 'Tạo automation' };
  }
}
</script>
</body>
</html>
