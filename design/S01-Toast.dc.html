<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Toast</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/devicenet/components/bundle.css">
<link rel="stylesheet" href="dn.css">
<script src="ds/devicenet/components/bundle.js"></script>
<script src="dn-icons.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
body{margin:0}
a{color:#2f6bff}a:hover{color:#1f4fd0}
</style>
</helmet>
<div class="ph {{theme}}" style="position: relative; width: 390px; height: 844px; display: flex; flex-direction: column; overflow: hidden">
  <header class="hdr">
    <div class="hdr-l">
      <button class="sitesw" type="button" aria-label="Đổi site: Nhà">Nhà<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
    </div>
    <div class="hdr-r">
      <button class="ibtn" type="button" aria-label="Thêm"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg></button>
    </div>
  </header>
  <div class="body">
    <div style="display: flex; gap: 8px; padding: 12px 16px 4px; overflow: hidden; white-space: nowrap">
      <x-import component-from-global-scope="DeviceNet.Chip" selected="{{yes}}">Tất cả</x-import>
      <x-import component-from-global-scope="DeviceNet.Chip">Bếp</x-import>
      <x-import component-from-global-scope="DeviceNet.Chip">Phòng khách</x-import>
      <x-import component-from-global-scope="DeviceNet.Chip">Phòng ngủ</x-import>
      <x-import component-from-global-scope="DeviceNet.Chip">Sân</x-import>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; padding: 12px 16px 16px">
      <x-import component-from-global-scope="DeviceNet.DeviceTile" size="2x1" kind="mixed" name="Ổ cắm máy giặt" room="Bếp" value="86" unit="W" on="{{yes}}" extras="{{wm}}" icon="{{ic.plug}}" style="grid-column: span 2"></x-import>
      <x-import component-from-global-scope="DeviceNet.DeviceTile" kind="mixed" name="Ổ cắm tủ lạnh" room="Bếp" value="112" unit="W" on="{{yes}}" icon="{{ic.plug}}"></x-import>
      <x-import component-from-global-scope="DeviceNet.DeviceTile" kind="switch" name="Công tắc đèn khách" room="Phòng khách" on="{{no}}" icon="{{ic.toggle}}"></x-import>
      <x-import component-from-global-scope="DeviceNet.DeviceTile" kind="mixed" name="Ổ cắm quạt" room="Phòng ngủ" value="0" unit="W" on="{{no}}" icon="{{ic.fan}}"></x-import>
      <x-import component-from-global-scope="DeviceNet.DeviceTile" kind="sensor" name="Cảm biến nhiệt ẩm" room="Phòng ngủ" value="27,5" unit="°C" icon="{{ic.temp}}"></x-import>
    </div>
  </div>

  <div role="status" aria-live="polite" style="position: absolute; left: 16px; right: 16px; bottom: 99px; min-height: 48px; display: flex; align-items: center; gap: 12px; padding: 8px 8px 8px 12px; border-radius: 12px; background: var(--text); color: var(--bg); font: 500 15px/20px var(--font-sans)">
    <sc-if value="{{isErr}}" hint-placeholder-val="{{yes}}">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--danger)"><circle cx="12" cy="12" r="10"></circle><path d="M12 8v4"></path><path d="M12 16h.01"></path></svg>
    </sc-if>
    <sc-if value="{{isUpdate}}" hint-placeholder-val="{{no}}">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"></path><path d="M21 3v5h-5"></path></svg>
    </sc-if>
    <span style="flex: 1; min-width: 0">{{msg}}</span>
    <sc-if value="{{hasAction}}" hint-placeholder-val="{{no}}">
      <button type="button" style="min-height: 44px; border: 0; background: transparent; color: var(--bg); font: 600 15px/20px var(--font-sans); padding: 0 8px; cursor: pointer; text-decoration: underline">{{action}}</button>
    </sc-if>
  </div>

  <nav class="tabbar" aria-label="Điều hướng chính">
    <a class="tab tab-on" href="S01-Home.dc.html" aria-current="page"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><path d="M9 22V12h6v10"></path></svg>Home</a>
    <a class="tab" href="S02-Scene.dc.html"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"></path></svg>Automate</a>
    <a class="tab" href="S03-Me.dc.html"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>Me</a>
  </nav>
  <div class="home" aria-hidden="true"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false,"section":"Giao diện"},"kind":{"editor":"enum","options":["timeout","error","update"],"default":"timeout","section":"Trạng thái"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var I = window.dnIcon;
    var k = this.props.kind || 'timeout';
    var msg = k === 'update' ? 'Có bản mới' : (k === 'error' ? 'Không xóa được thiết bị. Thử lại sau.' : 'Không nhận được phản hồi từ Ổ cắm quạt');
    return { yes: true, no: false, theme: this.props.dark ? 'dn-dark' : 'dn-light',
      isErr: k !== 'update', isUpdate: k === 'update', msg: msg,
      hasAction: k === 'update', action: 'Tải lại',
      wm: [{ value: 228, unit: 'V' }, { value: '0,38', unit: 'A' }],
      ic: { plug: I('plug'), toggle: I('toggle'), fan: I('fan'), temp: I('temp') } };
  }
}
</script>
</body>
</html>
