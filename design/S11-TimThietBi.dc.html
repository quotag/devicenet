<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>S-11 Thêm thiết bị · Tìm thiết bị</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/devicenet/components/bundle.css">
<link rel="stylesheet" href="dn.css">
<script src="ds/devicenet/components/bundle.js"></script>
<script src="dn-icons.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
body{margin:0}
a{color:#2f6bff}a:hover{color:#1f4fd0}
</style>
</helmet>
<div class="ph {{theme}}" style="position: relative; width: 390px; height: 844px; display: flex; flex-direction: column; overflow: hidden">
  <header class="hdr">
    <div class="hdr-l">
      <button class="ibtn" type="button" aria-label="Quay lại"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5"></path><path d="M12 19l-7-7 7-7"></path></svg></button>
      <h1 class="title">Thêm thiết bị</h1>
    </div>
    <div class="hdr-r"><button class="txtbtn" type="button">Hủy</button></div>
  </header>
  <div class="body" style="gap: 16px; padding: 16px 16px 0">
    <x-import component-from-global-scope="DeviceNet.Stepper" steps="{{steps}}" current="{{n1}}" style="width: 100%"></x-import>
    <div class="row" style="padding: 0; min-height: 24px">
      <span class="dot" style="background: var(--success)"></span>
      <span class="cap">Hub Nhà · online · đang mở ghép nối</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 8px 0">
      <div style="position: relative; width: 140px; height: 140px" role="timer" aria-label="Còn 87 giây">
        <svg viewBox="0 0 140 140" width="140" height="140" aria-hidden="true" style="transform: rotate(-90deg)">
          <circle cx="70" cy="70" r="64" fill="none" stroke="var(--surface-2)" stroke-width="8"></circle>
          <circle cx="70" cy="70" r="64" fill="none" stroke="var(--accent)" stroke-width="8" stroke-linecap="round" stroke-dasharray="402" stroke-dashoffset="110"></circle>
        </svg>
        <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center">
          <span class="dn-num" style="font-size: 32px; line-height: 38px; font-weight: 600">87</span>
          <span class="cap">giây</span>
        </div>
      </div>
      <p class="body-t" style="text-align: center; max-width: 300px">Giữ nút trên thiết bị 5 giây đến khi đèn nháy.</p>
    </div>
    <div style="display: flex; flex-direction: column; gap: 12px">
      <span class="cap">Đã tìm thấy 1 thiết bị</span>
      <x-import component-from-global-scope="DeviceNet.Card" highlight="{{yes}}" style="width: 100%">
        <div style="display: flex; flex-direction: column; gap: 12px">
          <div style="display: flex; align-items: center; gap: 12px">
            <span style="width: 40px; height: 40px; border-radius: 12px; background: var(--surface-2); display: inline-flex; align-items: center; justify-content: center; flex: none"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22v-5"></path><path d="M9 8V2"></path><path d="M15 8V2"></path><path d="M18 8H6v4a6 6 0 0 0 12 0V8z"></path></svg></span>
            <span class="row-main"><span class="lbl">TS011F · Ổ cắm đo điện</span><span class="cap">Tuya · 4 thuộc tính · LQI 112</span></span>
            <x-import component-from-global-scope="DeviceNet.Badge" tone="new">Mới</x-import>
          </div>
          <x-import component-from-global-scope="DeviceNet.Button" variant="secondary" block="{{yes}}" style="width: 100%">Đặt tên</x-import>
        </div>
      </x-import>
      <div style="height: 64px; border: 1px dashed var(--border); border-radius: 16px; display: flex; align-items: center; justify-content: center; gap: 8px; color: var(--text-muted)">
        <span class="dn-spin" aria-hidden="true"></span><span class="cap">Đang tìm thêm…</span>
      </div>
    </div>
  </div>
  <div style="padding: 16px 16px 40px">
    <x-import component-from-global-scope="DeviceNet.Button" variant="primary" block="{{yes}}" style="width: 100%">Tiếp tục với 1 thiết bị</x-import>
  </div>
  <div class="home" aria-hidden="true"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false,"section":"Giao diện"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { yes: true, n1: 1, theme: this.props.dark ? 'dn-dark' : 'dn-light', steps: ['Chọn hub', 'Tìm thiết bị', 'Đặt tên'] };
  }
}
</script>
</body>
</html>
