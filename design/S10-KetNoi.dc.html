<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>S-10 Thêm hub · Kết nối</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/devicenet/components/bundle.css">
<link rel="stylesheet" href="dn.css">
<script src="ds/devicenet/components/bundle.js"></script>
<script src="dn-icons.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
body{margin:0}
a{color:#2f6bff}a:hover{color:#1f4fd0}
</style>
</helmet>
<div class="ph {{theme}}" style="position: relative; width: 390px; height: 844px; display: flex; flex-direction: column; overflow: hidden">
  <header class="hdr">
    <div class="hdr-l">
      <button class="ibtn" type="button" aria-label="Quay lại"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5"></path><path d="M12 19l-7-7 7-7"></path></svg></button>
      <h1 class="title">Thêm hub</h1>
    </div>
    <div class="hdr-r"></div>
  </header>
  <div class="body" style="gap: 20px; padding: 16px 16px 0">
    <x-import component-from-global-scope="DeviceNet.Stepper" steps="{{steps}}" current="{{n2}}" style="width: 100%"></x-import>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 12px 0">
      <div style="width: 72px; height: 72px; border-radius: 999px; background: var(--success-tint); color: var(--success); display: flex; align-items: center; justify-content: center">
        <svg class="ic ic-lg" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6L9 17l-5-5"></path></svg>
      </div>
      <div style="display: flex; flex-direction: column; gap: 4px; align-items: center">
        <span class="lbl" style="font-size: 20px; line-height: 26px; font-weight: 600">Hub đã online</span>
        <p class="cap">Đang xác nhận mã → Đang chờ hub → Hub đã online</p>
      </div>
    </div>
    <div class="list" style="margin: 0">
      <div class="kv"><span class="cap">Phiên bản agent</span><span class="lbl dn-num">v1.2.0</span></div>
      <div class="kv"><span class="cap">Địa chỉ LAN</span><span class="lbl dn-num">192.168.1.20:8080</span></div>
      <div class="kv"><span class="cap">Zigbee2MQTT</span><span class="lbl dn-num">2.1.3</span></div>
    </div>
    <x-import component-from-global-scope="DeviceNet.Input" label="Tên hub" default-value="Hub Nhà" style="width: 100%"></x-import>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <span class="lbl">Site</span>
      <div style="display: flex; gap: 8px; flex-wrap: wrap">
        <x-import component-from-global-scope="DeviceNet.Chip" selected="{{yes}}">Nhà</x-import>
        <x-import component-from-global-scope="DeviceNet.Chip" add="{{yes}}">Site mới</x-import>
      </div>
    </div>
  </div>
  <div style="padding: 16px 16px 40px; display: flex; flex-direction: column; gap: 8px">
    <x-import component-from-global-scope="DeviceNet.Button" variant="primary" block="{{yes}}" style="width: 100%">Thêm thiết bị ngay</x-import>
    <x-import component-from-global-scope="DeviceNet.Button" variant="ghost" block="{{yes}}" style="width: 100%">Hoàn tất</x-import>
  </div>
  <div class="home" aria-hidden="true"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false,"section":"Giao diện"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { yes: true, n2: 2, theme: this.props.dark ? 'dn-dark' : 'dn-light', steps: ['Cài agent', 'Nhập mã', 'Kết nối'] };
  }
}
</script>
</body>
</html>
