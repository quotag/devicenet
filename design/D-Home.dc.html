<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Desktop · Home</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/devicenet/components/bundle.css">
<link rel="stylesheet" href="dn.css">
<script src="ds/devicenet/components/bundle.js"></script>
<script src="dn-icons.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
body{margin:0}
a{color:#2f6bff}a:hover{color:#1f4fd0}
.dn-tile{width:100%}.dn-tile-2x1{width:100%}.dn-tile-side{width:38%}
.dside a{color:var(--text)}.dside a:hover{color:var(--text)}
</style>
</helmet>
<div class="ph {{theme}}" style="min-height: 900px; display: flex; flex-wrap: wrap; align-items: stretch">
  <aside class="dside" style="flex: 0 1 240px; min-width: 200px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; gap: 24px; padding: 24px 16px">
    <div style="display: flex; align-items: center; gap: 12px">
      <span style="width: 36px; height: 36px; border-radius: 10px; background: var(--on-tint); color: var(--accent); display: inline-flex; align-items: center; justify-content: center; flex: none"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 14h16a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2z"></path><path d="M6 18h.01"></path><path d="M10 18h.01"></path><path d="M15 10v4"></path><path d="M17.84 7.17a4 4 0 0 0-5.66 0"></path><path d="M20.66 4.34a8 8 0 0 0-11.31 0"></path></svg></span>
      <span class="lbl" style="font-size: 17px">DeviceNet</span>
    </div>
    <button class="sitesw" type="button" style="font-size: 15px; justify-content: space-between; width: 100%; padding: 0 12px; background: var(--surface-2); border-radius: 12px" aria-label="Đổi site: Nhà">Nhà<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
    <nav aria-label="Điều hướng chính" style="display: flex; flex-direction: column; gap: 4px">
      <a href="D-Home.dc.html" aria-current="page" class="row" style="text-decoration: none; border-radius: 12px; background: var(--on-tint); color: var(--accent); font-weight: 500"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><path d="M9 22V12h6v10"></path></svg>Home</a>
      <a href="D-RuleEditor.dc.html" class="row" style="text-decoration: none; border-radius: 12px; position: relative"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"></path></svg>Automate<span class="dot" style="background: var(--danger); margin-left: auto" aria-label="Có rule lỗi"></span></a>
      <a href="S03-Me.dc.html" class="row" style="text-decoration: none; border-radius: 12px"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>Me</a>
    </nav>
    <div style="margin-top: auto" class="card">
      <div style="display: flex; align-items: center; gap: 8px"><span class="dot" style="background: var(--success)"></span><span class="lbl">Hub Nhà</span></div>
      <p class="cap dn-num" style="margin-top: 4px">online · v1.2.0 · 6 thiết bị</p>
    </div>
  </aside>
  <main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 16px; padding: 24px 32px">
    <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">
      <h1 class="title" style="font-size: 24px; line-height: 30px">Nhà</h1>
      <div style="display: flex; gap: 8px; flex-wrap: wrap">
        <x-import component-from-global-scope="DeviceNet.Button" variant="secondary">Sắp xếp</x-import>
        <x-import component-from-global-scope="DeviceNet.Button" variant="primary">+ Thêm</x-import>
      </div>
    </div>
    <div style="display: flex; gap: 8px; flex-wrap: wrap">
      <x-import component-from-global-scope="DeviceNet.Chip" selected="{{yes}}">Tất cả</x-import>
      <x-import component-from-global-scope="DeviceNet.Chip">Bếp</x-import>
      <x-import component-from-global-scope="DeviceNet.Chip">Phòng khách</x-import>
      <x-import component-from-global-scope="DeviceNet.Chip">Phòng ngủ</x-import>
      <x-import component-from-global-scope="DeviceNet.Chip">Sân</x-import>
      <x-import component-from-global-scope="DeviceNet.Chip" add="{{yes}}">Room</x-import>
    </div>
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; max-width: 1000px">
      <x-import component-from-global-scope="DeviceNet.DeviceTile" size="2x1" kind="mixed" name="Ổ cắm máy giặt" room="Bếp" value="86" unit="W" on="{{yes}}" extras="{{wm}}" icon="{{ic.plug}}" style="grid-column: span 2"></x-import>
      <x-import component-from-global-scope="DeviceNet.DeviceTile" kind="mixed" name="Ổ cắm tủ lạnh" room="Bếp" value="112" unit="W" on="{{yes}}" icon="{{ic.plug}}"></x-import>
      <x-import component-from-global-scope="DeviceNet.DeviceTile" kind="switch" name="Công tắc đèn khách" room="Phòng khách" on="{{no}}" icon="{{ic.toggle}}"></x-import>
      <x-import component-from-global-scope="DeviceNet.DeviceTile" kind="mixed" name="Ổ cắm quạt" room="Phòng ngủ" value="0" unit="W" on="{{no}}" icon="{{ic.fan}}"></x-import>
      <x-import component-from-global-scope="DeviceNet.DeviceTile" kind="sensor" name="Cảm biến nhiệt ẩm" room="Phòng ngủ" value="27,5" unit="°C" icon="{{ic.temp}}"></x-import>
      <x-import component-from-global-scope="DeviceNet.DeviceTile" kind="switch" name="Đèn sân" room="Sân" offline="{{yes}}" last-seen="12:40" icon="{{ic.bulb}}"></x-import>
      <a href="S11-TimThietBi.dc.html" style="min-height: 120px; border: 1px dashed var(--text-muted); border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: var(--text-muted); text-decoration: none"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg><span class="cap">Thêm thiết bị</span></a>
    </div>
    <p class="cap">Lưới 4 cột tại 1280; dưới 900 px rút về 2 cột, sidebar xếp lên trên. Tile 2×1 chiếm 2 cột.</p>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false,"section":"Giao diện"},"$preview":{"width":1280,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    var I = window.dnIcon;
    return { yes: true, no: false, theme: this.props.dark ? 'dn-dark' : 'dn-light',
      wm: [{ value: 228, unit: 'V' }, { value: '0,38', unit: 'A' }],
      ic: { plug: I('plug'), toggle: I('toggle'), fan: I('fan'), temp: I('temp'), bulb: I('bulb') } };
  }
}
</script>
</body>
</html>
