<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>S-01 Home · hub offline</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/devicenet/components/bundle.css">
<link rel="stylesheet" href="dn.css">
<script src="ds/devicenet/components/bundle.js"></script>
<script src="dn-icons.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
body{margin:0}
a{color:#2f6bff}a:hover{color:#1f4fd0}
</style>
</helmet>
<div class="ph {{theme}}" style="position: relative; width: 390px; height: 844px; display: flex; flex-direction: column; overflow: hidden">
  <header class="hdr">
    <div class="hdr-l">
      <button class="sitesw" type="button" aria-label="Đổi site: Nhà">Nhà<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
    </div>
    <div class="hdr-r">
      <button class="ibtn" type="button" aria-label="Thêm"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg></button>
    </div>
  </header>
  <x-import component-from-global-scope="DeviceNet.Banner" kind="{{bannerKind}}" action="Xem hub" style="width: 100%">{{bannerText}}</x-import>
  <div class="body">
    <div style="display: flex; gap: 8px; padding: 12px 16px 4px; overflow: hidden; white-space: nowrap">
      <x-import component-from-global-scope="DeviceNet.Chip" selected="{{yes}}">Tất cả</x-import>
      <x-import component-from-global-scope="DeviceNet.Chip">Bếp</x-import>
      <x-import component-from-global-scope="DeviceNet.Chip">Phòng khách</x-import>
      <x-import component-from-global-scope="DeviceNet.Chip">Phòng ngủ</x-import>
      <x-import component-from-global-scope="DeviceNet.Chip">Sân</x-import>
      <x-import component-from-global-scope="DeviceNet.Chip" add="{{yes}}" aria-label="Thêm room"></x-import>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; padding: 12px 16px 16px">
      <x-import component-from-global-scope="DeviceNet.DeviceTile" size="2x1" kind="mixed" name="Ổ cắm máy giặt" offline="{{off}}" last-seen="12:40" value="86" unit="W" on="{{yes}}" extras="{{wm}}" icon="{{ic.plug}}" style="grid-column: span 2"></x-import>
      <x-import component-from-global-scope="DeviceNet.DeviceTile" kind="mixed" name="Ổ cắm tủ lạnh" offline="{{off}}" last-seen="12:40" value="112" unit="W" on="{{yes}}" icon="{{ic.plug}}"></x-import>
      <x-import component-from-global-scope="DeviceNet.DeviceTile" kind="switch" name="Công tắc đèn khách" offline="{{off}}" last-seen="12:40" on="{{no}}" icon="{{ic.toggle}}"></x-import>
      <x-import component-from-global-scope="DeviceNet.DeviceTile" kind="mixed" name="Ổ cắm quạt" offline="{{off}}" last-seen="12:40" value="0" unit="W" on="{{no}}" icon="{{ic.fan}}"></x-import>
      <x-import component-from-global-scope="DeviceNet.DeviceTile" kind="sensor" name="Cảm biến nhiệt ẩm" offline="{{off}}" last-seen="12:40" value="27,5" unit="°C" icon="{{ic.temp}}"></x-import>
      <x-import component-from-global-scope="DeviceNet.DeviceTile" kind="switch" name="Đèn sân" offline="{{yes}}" last-seen="12:40" icon="{{ic.bulb}}"></x-import>
    </div>
  </div>
  <nav class="tabbar" aria-label="Điều hướng chính">
    <a class="tab tab-on" href="S01-Home.dc.html" aria-current="page"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><path d="M9 22V12h6v10"></path></svg>Home</a>
    <a class="tab" href="S02-Scene.dc.html"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"></path></svg>Automate</a>
    <a class="tab" href="S03-Me.dc.html"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>Me<span class="tab-dot" aria-label="Hub offline"></span></a>
  </nav>
  <div class="home" aria-hidden="true"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false,"section":"Giao diện"},"mode":{"editor":"enum","options":["offline","lan","reconnecting"],"default":"offline","section":"Trạng thái"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var I = window.dnIcon;
    var mode = this.props.mode || 'offline';
    var text = mode === 'lan' ? 'Đang dùng chế độ LAN · 192.168.1.20' : (mode === 'reconnecting' ? 'Đang kết nối lại…' : 'Hub Nhà đang offline · lần cuối 12:40');
    return { yes: true, no: false, off: mode === 'offline', theme: this.props.dark ? 'dn-dark' : 'dn-light',
      bannerKind: mode, bannerText: text,
      wm: [{ value: 228, unit: 'V' }, { value: '0,38', unit: 'A' }],
      ic: { plug: I('plug'), toggle: I('toggle'), fan: I('fan'), temp: I('temp'), bulb: I('bulb') } };
  }
}
</script>
</body>
</html>
