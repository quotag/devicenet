<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>SH-6 Sửa hoặc xóa scene, automation</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/devicenet/components/bundle.css">
<link rel="stylesheet" href="dn.css">
<script src="ds/devicenet/components/bundle.js"></script>
<script src="dn-icons.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
body{margin:0}
a{color:#2f6bff}a:hover{color:#1f4fd0}
</style>
</helmet>
<div class="ph {{theme}}" style="position: relative; width: 390px; height: 844px; display: flex; flex-direction: column; overflow: hidden">
  <header class="hdr">
    <div class="hdr-l"><h1 class="title">Automate</h1></div>
    <div class="hdr-r">
      <button class="ibtn" type="button" aria-label="Tạo scene hoặc automation"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg></button>
    </div>
  </header>
  <div class="body" style="gap: 16px; padding: 12px 16px 0">
    <x-import component-from-global-scope="DeviceNet.SegmentedTabs" items="{{tabs}}" value="{{n0}}" style="width: 100%"></x-import>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px">
      <button type="button" class="card" style="height: 120px; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start; text-align: left; color: var(--text); cursor: pointer; font-family: inherit; border-color: var(--accent); border-width: 2px" aria-label="Scene Đi ngủ, đang giữ">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        <span class="row-main"><span class="lbl">Đi ngủ</span><span class="cap">3 hành động</span></span>
      </button>
      <button type="button" class="card" style="height: 120px; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start; text-align: left; color: var(--text); cursor: pointer; font-family: inherit" aria-label="Chạy scene Xem phim">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2"></rect><path d="M7 4v16"></path><path d="M17 4v16"></path><path d="M2 12h20"></path></svg>
        <span class="row-main"><span class="lbl">Xem phim</span><span class="cap">2 hành động</span></span>
      </button>
    </div>
  </div>
  <nav class="tabbar" aria-label="Điều hướng chính">
    <a class="tab" href="S01-Home.dc.html"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><path d="M9 22V12h6v10"></path></svg>Home</a>
    <a class="tab tab-on" href="S02-Scene.dc.html" aria-current="page"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"></path></svg>Automate</a>
    <a class="tab" href="S03-Me.dc.html"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>Me</a>
  </nav>
  <div class="scrim" aria-hidden="true"></div>

  <sc-if value="{{isMenu}}" hint-placeholder-val="{{yes}}">
    <div style="position: absolute; left: 0; right: 0; bottom: 0">
      <x-import component-from-global-scope="DeviceNet.Sheet" title="Đi ngủ" style="width: 100%">
        <div style="display: flex; flex-direction: column">
          <a href="S30-RuleEditor.dc.html" class="row" style="color: var(--text); text-decoration: none; padding: 8px 0; border-bottom: 1px solid var(--border)">
            <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg>
            <span class="row-main"><span class="lbl">Sửa</span><span class="cap">Đổi tên, icon, hành động</span></span>
            <svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--text-muted)"><path d="M9 18l6-6-6-6"></path></svg>
          </a>
          <button type="button" class="row" style="border: 0; background: transparent; color: var(--danger); padding: 8px 0; cursor: pointer; text-align: left; font-family: inherit">
            <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18"></path><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path><path d="M10 11v6"></path><path d="M14 11v6"></path><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path></svg>
            <span class="row-main"><span class="lbl">Xóa</span></span>
          </button>
        </div>
      </x-import>
    </div>
  </sc-if>

  <sc-if value="{{isConfirm}}" hint-placeholder-val="{{no}}">
    <div style="position: absolute; left: 24px; right: 24px; top: 50%; transform: translateY(-50%)">
      <div class="card" role="dialog" aria-modal="true" aria-labelledby="dlg-auto" style="padding: 20px; display: flex; flex-direction: column; gap: 16px">
        <span class="lbl" id="dlg-auto" style="font-size: 20px; line-height: 26px; font-weight: 600; white-space: normal">Xóa "Đi ngủ"?</span>
        <p class="body-t" style="color: var(--text-muted)">Hub sẽ gỡ scene này. 1 automation đang chạy scene này sẽ bị đánh dấu lỗi:</p>
        <div class="list" style="margin: 0"><div class="row"><x-import component-from-global-scope="DeviceNet.Badge" tone="error">Sẽ lỗi</x-import><span class="lbl">Tắt hết lúc 23:00</span></div></div>
        <p class="cap">Lịch sử chạy vẫn giữ trong mục Lịch sử.</p>
        <div style="display: flex; gap: 8px">
          <x-import component-from-global-scope="DeviceNet.Button" variant="secondary" style="flex: 1">Giữ lại</x-import>
          <x-import component-from-global-scope="DeviceNet.Button" variant="danger" style="flex: 1">Xóa</x-import>
        </div>
      </div>
    </div>
  </sc-if>
  <div class="home" aria-hidden="true" style="background: #fff; opacity: .8"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false,"section":"Giao diện"},"step":{"editor":"enum","options":["menu","confirm"],"default":"menu","section":"Trạng thái"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var s = this.props.step || 'menu';
    return { yes: true, no: false, n0: 0, theme: this.props.dark ? 'dn-dark' : 'dn-light',
      tabs: ['Tap-to-run', 'Automation'], isMenu: s === 'menu', isConfirm: s === 'confirm' };
  }
}
</script>
</body>
</html>
