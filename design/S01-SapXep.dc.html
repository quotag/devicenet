<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>S-01 Home · chế độ sắp xếp</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/devicenet/components/bundle.css">
<link rel="stylesheet" href="dn.css">
<script src="ds/devicenet/components/bundle.js"></script>
<script src="dn-icons.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
body{margin:0}
a{color:#2f6bff}a:hover{color:#1f4fd0}
</style>
</helmet>
<div class="ph {{theme}}" style="position: relative; width: 390px; height: 844px; display: flex; flex-direction: column; overflow: hidden">
  <header class="hdr">
    <div class="hdr-l">
      <button class="sitesw" type="button" disabled aria-label="Đổi site (tắt khi sắp xếp)">Nhà<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
    </div>
    <div class="hdr-r">
      <button class="txtbtn" type="button">Xong</button>
    </div>
  </header>
  <div class="body">
    <p class="cap" style="padding: 12px 16px 0">Kéo để đổi chỗ · kéo góc dưới phải để đổi cỡ 1×1 ↔ 2×1</p>
    <div style="display: flex; gap: 8px; padding: 8px 16px 4px; overflow: hidden; white-space: nowrap; opacity: .45">
      <x-import component-from-global-scope="DeviceNet.Chip" selected="{{yes}}">Tất cả</x-import>
      <x-import component-from-global-scope="DeviceNet.Chip">Bếp</x-import>
      <x-import component-from-global-scope="DeviceNet.Chip">Phòng khách</x-import>
      <x-import component-from-global-scope="DeviceNet.Chip">Phòng ngủ</x-import>
      <x-import component-from-global-scope="DeviceNet.Chip">Sân</x-import>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; padding: 12px 16px 16px">
      <x-import component-from-global-scope="DeviceNet.DeviceTile" size="2x1" kind="mixed" name="Ổ cắm máy giặt" room="Bếp" value="86" unit="W" on="{{yes}}" arranging="{{yes}}" extras="{{wm}}" icon="{{ic.plug}}" style="grid-column: span 2"></x-import>
      <x-import component-from-global-scope="DeviceNet.DeviceTile" kind="mixed" name="Ổ cắm tủ lạnh" room="Bếp" value="112" unit="W" on="{{yes}}" arranging="{{yes}}" icon="{{ic.plug}}"></x-import>
      <div style="width: 171px; height: 120px; border: 2px dashed var(--accent); border-radius: 16px; background: var(--on-tint)" aria-label="Vị trí thả"></div>
      <x-import component-from-global-scope="DeviceNet.DeviceTile" kind="mixed" name="Ổ cắm quạt" room="Phòng ngủ" value="0" unit="W" on="{{no}}" arranging="{{yes}}" icon="{{ic.fan}}"></x-import>
      <x-import component-from-global-scope="DeviceNet.DeviceTile" kind="sensor" name="Cảm biến nhiệt ẩm" room="Phòng ngủ" value="27,5" unit="°C" arranging="{{yes}}" icon="{{ic.temp}}"></x-import>
      <x-import component-from-global-scope="DeviceNet.DeviceTile" kind="switch" name="Đèn sân" room="Sân" offline="{{yes}}" last-seen="12:40" arranging="{{yes}}" icon="{{ic.bulb}}"></x-import>
      <x-import component-from-global-scope="DeviceNet.DeviceTile" kind="switch" name="Công tắc đèn khách" room="Phòng khách" on="{{no}}" arranging="{{yes}}" icon="{{ic.toggle}}" style="transform: translate(-70px, -140px) scale(1.04); z-index: 2; filter: drop-shadow(0 8px 16px rgba(21, 24, 30, .25))"></x-import>
    </div>
  </div>
  <nav class="tabbar" aria-label="Điều hướng chính" style="opacity: .45">
    <a class="tab tab-on" href="S01-Home.dc.html" aria-current="page"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><path d="M9 22V12h6v10"></path></svg>Home</a>
    <a class="tab" href="S02-Scene.dc.html"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"></path></svg>Automate</a>
    <a class="tab" href="S03-Me.dc.html"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>Me</a>
  </nav>
  <div class="home" aria-hidden="true"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false,"section":"Giao diện"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var I = window.dnIcon;
    return { yes: true, no: false, theme: this.props.dark ? 'dn-dark' : 'dn-light',
      wm: [{ value: 228, unit: 'V' }, { value: '0,38', unit: 'A' }],
      ic: { plug: I('plug'), toggle: I('toggle'), fan: I('fan'), temp: I('temp'), bulb: I('bulb') } };
  }
}
</script>
</body>
</html>
