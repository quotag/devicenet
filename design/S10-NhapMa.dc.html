<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>S-10 Thêm hub · Nhập mã</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/devicenet/components/bundle.css">
<link rel="stylesheet" href="dn.css">
<script src="ds/devicenet/components/bundle.js"></script>
<script src="dn-icons.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
body{margin:0}
a{color:#2f6bff}a:hover{color:#1f4fd0}
</style>
</helmet>
<div class="ph {{theme}}" style="position: relative; width: 390px; height: 844px; display: flex; flex-direction: column; overflow: hidden">
  <header class="hdr">
    <div class="hdr-l">
      <button class="ibtn" type="button" aria-label="Quay lại"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5"></path><path d="M12 19l-7-7 7-7"></path></svg></button>
      <h1 class="title">Thêm hub</h1>
    </div>
    <div class="hdr-r"></div>
  </header>
  <div class="body" style="gap: 20px; padding: 16px 16px 0">
    <x-import component-from-global-scope="DeviceNet.Stepper" steps="{{steps}}" current="{{n1}}" style="width: 100%"></x-import>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <h2 class="title" style="font-size: 20px">Nhập mã của hub</h2>
      <p class="body-t" style="color: var(--text-muted)">Mã hiện ở trang <span class="dn-num">http://&lt;ip&gt;:8080/setup</span> hoặc trong log của agent.</p>
    </div>
    <div style="display: flex; gap: 6px; justify-content: space-between" role="group" aria-label="Mã 8 ký tự">
      <div class="codecell dn-num">K</div>
      <div class="codecell dn-num">7</div>
      <div class="codecell dn-num">M</div>
      <div class="codecell dn-num">2</div>
      <div class="codecell codecell-active dn-num" aria-current="true"></div>
      <div class="codecell dn-num"></div>
      <div class="codecell dn-num"></div>
      <div class="codecell dn-num"></div>
    </div>
    <div style="display: flex; align-items: center; gap: 12px">
      <div style="flex: 1; height: 1px; background: var(--border)"></div>
      <span class="cap">hoặc</span>
      <div style="flex: 1; height: 1px; background: var(--border)"></div>
    </div>
    <x-import component-from-global-scope="DeviceNet.Button" variant="secondary" block="{{yes}}" style="width: 100%">Quét QR trên trang setup</x-import>
    <p class="cap">Mã hết hạn sau 15 phút và chỉ dùng được một lần. Nếu không thấy mã, chạy lại agent để lấy mã mới.</p>
  </div>
  <div style="padding: 16px 16px 40px">
    <x-import component-from-global-scope="DeviceNet.Button" variant="primary" block="{{yes}}" disabled="{{yes}}" style="width: 100%">Kết nối</x-import>
  </div>
  <div class="home" aria-hidden="true"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false,"section":"Giao diện"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { yes: true, n1: 1, theme: this.props.dark ? 'dn-dark' : 'dn-light', steps: ['Cài agent', 'Nhập mã', 'Kết nối'] };
  }
}
</script>
</body>
</html>
