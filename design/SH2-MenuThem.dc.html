<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>SH-2 Menu thêm</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/devicenet/components/bundle.css">
<link rel="stylesheet" href="dn.css">
<script src="ds/devicenet/components/bundle.js"></script>
<script src="dn-icons.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
body{margin:0}
a{color:#2f6bff}a:hover{color:#1f4fd0}
</style>
</helmet>
<div class="ph {{theme}}" style="position: relative; width: 390px; height: 844px; display: flex; flex-direction: column; overflow: hidden">
  <header class="hdr">
    <div class="hdr-l">
      <button class="sitesw" type="button" aria-label="Đổi site: Nhà">Nhà<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
    </div>
    <div class="hdr-r">
      <button class="ibtn" type="button" aria-label="Đóng menu" aria-expanded="true"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6L6 18"></path><path d="M6 6l12 12"></path></svg></button>
    </div>
  </header>
  <div class="body">
    <div style="display: flex; gap: 8px; padding: 12px 16px 4px; overflow: hidden; white-space: nowrap">
      <x-import component-from-global-scope="DeviceNet.Chip" selected="{{yes}}">Tất cả</x-import>
      <x-import component-from-global-scope="DeviceNet.Chip">Bếp</x-import>
      <x-import component-from-global-scope="DeviceNet.Chip">Phòng khách</x-import>
      <x-import component-from-global-scope="DeviceNet.Chip">Phòng ngủ</x-import>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; padding: 12px 16px 16px">
      <x-import component-from-global-scope="DeviceNet.DeviceTile" size="2x1" kind="mixed" name="Ổ cắm máy giặt" room="Bếp" value="86" unit="W" on="{{yes}}" extras="{{wm}}" icon="{{ic.plug}}" style="grid-column: span 2"></x-import>
      <x-import component-from-global-scope="DeviceNet.DeviceTile" kind="mixed" name="Ổ cắm tủ lạnh" room="Bếp" value="112" unit="W" on="{{yes}}" icon="{{ic.plug}}"></x-import>
      <x-import component-from-global-scope="DeviceNet.DeviceTile" kind="switch" name="Công tắc đèn khách" room="Phòng khách" on="{{no}}" icon="{{ic.toggle}}"></x-import>
    </div>
  </div>
  <div class="scrim" aria-hidden="true"></div>
  <div style="position: absolute; left: 0; right: 0; bottom: 0">
    <x-import component-from-global-scope="DeviceNet.Sheet" title="Thêm" style="width: 100%">
      <div style="display: flex; flex-direction: column">
        <a href="S11-TimThietBi.dc.html" class="row" style="color: var(--text); text-decoration: none; padding: 8px 0; border-bottom: 1px solid var(--border)">
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22v-5"></path><path d="M9 8V2"></path><path d="M15 8V2"></path><path d="M18 8H6v4a6 6 0 0 0 12 0V8z"></path></svg>
          <span class="row-main"><span class="lbl">Thêm thiết bị</span><span class="cap">Hub tìm thiết bị Zigbee trong 120 giây</span></span>
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--text-muted)"><path d="M9 18l6-6-6-6"></path></svg>
        </a>
        <button type="button" class="row" style="border: 0; background: transparent; color: var(--text); padding: 8px 0; cursor: pointer; text-align: left; border-bottom: 1px solid var(--border)">
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect></svg>
          <span class="row-main"><span class="lbl">Thêm room</span><span class="cap">Trong site Nhà</span></span>
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--text-muted)"><path d="M9 18l6-6-6-6"></path></svg>
        </button>
        <a href="S10-CaiAgent.dc.html" class="row" style="color: var(--text); text-decoration: none; padding: 8px 0; border-bottom: 1px solid var(--border)">
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 14h16a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2z"></path><path d="M6 18h.01"></path><path d="M10 18h.01"></path><path d="M15 10v4"></path><path d="M17.84 7.17a4 4 0 0 0-5.66 0"></path><path d="M20.66 4.34a8 8 0 0 0-11.31 0"></path></svg>
          <span class="row-main"><span class="lbl">Thêm hub</span><span class="cap">Cài agent · nhập mã · kết nối</span></span>
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--text-muted)"><path d="M9 18l6-6-6-6"></path></svg>
        </a>
        <button type="button" class="row" style="border: 0; background: transparent; color: var(--text); padding: 8px 0; cursor: pointer; text-align: left">
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16"></path><path d="M4 12h16"></path><path d="M4 17h10"></path></svg>
          <span class="row-main"><span class="lbl">Sắp xếp tile</span><span class="cap">Hoặc giữ lâu một tile</span></span>
        </button>
      </div>
    </x-import>
  </div>
  <div class="home" aria-hidden="true" style="background: #fff; opacity: .8"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false,"section":"Giao diện"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var I = window.dnIcon;
    return { yes: true, no: false, theme: this.props.dark ? 'dn-dark' : 'dn-light',
      wm: [{ value: 228, unit: 'V' }, { value: '0,38', unit: 'A' }],
      ic: { plug: I('plug'), toggle: I('toggle') } };
  }
}
</script>
</body>
</html>
